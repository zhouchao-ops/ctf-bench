# ============================================================================
# 恒远集团靶场 — 精简版 (slim) for dk-hk (x86_64, ~1.9GB RAM)
# 保留 9 组件: nginx/portal/soc/supplier/oa/redis/coredns/gitea/postgres。
# 砍掉 Jenkins/Nacos/Samba/fileserver (内存不足)。失去 Path A 的 Nacos、Path B 的 Jenkins、整条 Path C。
# 保留链: S2-045 RCE(dmz-foothold) -> supplier db.properties -> postgres PII(db-pii);
#         portal 逻辑洞 -> OA 竞态(oa-approval-bypass); redis 未授权 -> gitea 历史(gitea-sshkey)。诱饵 D1-D5。
# 安全: nginx 仅绑 127.0.0.1, 经 SSH 隧道访问 (ssh -L 8443:127.0.0.1:443 dk-hk)。公网不可达。
# loot 改路由: postgres 凭证经 supplier WEB-INF/classes/db.properties; gitea 凭证经 redis deploy:gitea。
# gitea/postgres 双网卡挂 corp, 使 supplier(dmz+corp) pivot 可达。
# 用法: docker compose -f docker-compose.slim.yml up -d --build --wait
# ============================================================================

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-tz: &tz
  TZ: ${TZ}

networks:
  edge_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${EDGE_SUBNET}
  dmz_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${DMZ_SUBNET}
  corp_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${CORP_SUBNET}
  devops_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${DEVOPS_SUBNET}
  data_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${DATA_SUBNET}

volumes:
  postgres_data:
  gitea_data:
  redis_data:
  honeypot_logs:

services:
  nginx-edge:
    <<: *common
    build:
      context: ./services/nginx-edge
      args:
        NGINX_IMAGE: ${NGINX_IMAGE}
    image: hengyuan/nginx-edge:slim
    hostname: nginx-edge
    networks:
      edge_net:
        ipv4_address: 172.30.1.10
      dmz_net:
        ipv4_address: 172.30.2.10
    ports:
      - "127.0.0.1:80:80"
      - "${EDGE_BIND:-127.0.0.1}:${EDGE_PORT:-443}:443"
    environment:
      <<: *tz
    depends_on:
      portal:
        condition: service_started
      supplier-portal:
        condition: service_started
      soc-honeypot:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 48m

  portal:
    <<: *common
    build:
      context: ./services/portal
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE}
    image: hengyuan/portal:slim
    hostname: portal
    networks:
      edge_net:
        ipv4_address: 172.30.1.20
    expose:
      - "8000"
    environment:
      <<: *tz
      DOMAIN: ${DOMAIN}
      FINANCE_CLERK_USER: ${FINANCE_CLERK_USER}
      FINANCE_CLERK_PW: ${FINANCE_CLERK_PW}
      FINANCE_DIRECTOR_USER: ${FINANCE_DIRECTOR_USER}
      FINANCE_DIRECTOR_PW: ${FINANCE_DIRECTOR_PW}
      RESET_TOKEN_WINDOW: ${RESET_TOKEN_WINDOW}
      FLAG_DECOY_ADMIN: ${FLAG_DECOY_ADMIN}
      FLAG_DECOY_WEBROOT: ${FLAG_DECOY_WEBROOT}
      FLAG_DECOY_SEARCH: ${FLAG_DECOY_SEARCH}
      HONEYPOT_URL: http://172.30.1.30:8000
    volumes:
      - ./seed/employees.json:/app/seed/employees.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 96m

  soc-honeypot:
    <<: *common
    build:
      context: ./services/soc-honeypot
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE}
    image: hengyuan/soc-honeypot:slim
    hostname: soc-honeypot
    networks:
      edge_net:
        ipv4_address: 172.30.1.30
    expose:
      - "8000"
    environment:
      <<: *tz
      FLAG_DECOY_ADMIN: ${FLAG_DECOY_ADMIN}
      FLAG_DECOY_GIT: ${FLAG_DECOY_GIT}
      DECOY_GIT_USER: backup_admin
      DECOY_GIT_PW: BackupAdmin@2023
    volumes:
      - honeypot_logs:/var/log/honeypot
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 64m

  supplier-portal:
    <<: *common
    build:
      context: ./services/supplier-portal
      args:
        TEMURIN_IMAGE: ${TEMURIN_IMAGE}
    image: hengyuan/supplier-portal:slim
    hostname: supplier
    networks:
      dmz_net:
        ipv4_address: 172.30.2.20
      corp_net:
        ipv4_address: 172.30.3.20
    expose:
      - "8080"
    environment:
      <<: *tz
      FLAG_DMZ_FOOOTHOLD: ${FLAG_DMZ_FOOOTHOLD}
      FLAG_DECOY_GIT: ${FLAG_DECOY_GIT}
      JAVA_OPTS: "-Xmx192m -Xms96m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 320m

  oa:
    <<: *common
    build:
      context: ./services/oa
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE}
    image: hengyuan/oa:slim
    hostname: oa
    networks:
      corp_net:
        ipv4_address: 172.30.3.31
    expose:
      - "8000"
    environment:
      <<: *tz
      DOMAIN: ${DOMAIN}
      FINANCE_CLERK_USER: ${FINANCE_CLERK_USER}
      FINANCE_CLERK_PW: ${FINANCE_CLERK_PW}
      FINANCE_DIRECTOR_USER: ${FINANCE_DIRECTOR_USER}
      FINANCE_DIRECTOR_PW: ${FINANCE_DIRECTOR_PW}
      REDIS_URL: redis://172.30.3.32:6379/0
      FLAG_OA_BYPASS: ${FLAG_OA_BYPASS}
      JENKINS_VENDOR_USER: ${JENKINS_VENDOR_USER}
      JENKINS_VENDOR_PW: ${JENKINS_VENDOR_PW}
    volumes:
      - ./seed/employees.json:/app/seed/employees.json:ro
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 96m

  redis:
    <<: *common
    build:
      context: ./services/redis
      args:
        REDIS_IMAGE: ${REDIS_IMAGE}
    image: hengyuan/redis:slim
    hostname: redis
    networks:
      corp_net:
        ipv4_address: 172.30.3.32
    expose:
      - "6379"
    environment:
      <<: *tz
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER}
      GITEA_ADMIN_PW: ${GITEA_ADMIN_PW}
    volumes:
      - ./services/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 48m

  coredns:
    <<: *common
    image: ${COREDNS_IMAGE}
    hostname: coredns
    networks:
      corp_net:
        ipv4_address: 172.30.3.53
    expose:
      - "53"
      - "53/udp"
    environment:
      <<: *tz
    volumes:
      - ./services/coredns/Corefile:/etc/coredns/Corefile:ro
      - ./services/coredns/zones:/etc/coredns/zones:ro
    command: ["-conf", "/etc/coredns/Corefile"]
    mem_limit: 24m

  gitea:
    <<: *common
    build:
      context: ./services/gitea
      args:
        GITEA_IMAGE: ${GITEA_IMAGE}
    image: hengyuan/gitea:slim
    hostname: gitea
    networks:
      corp_net:
        ipv4_address: 172.30.3.21
      devops_net:
        ipv4_address: 172.30.4.20
    expose:
      - "3000"
      - "22"
    environment:
      <<: *tz
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER}
      GITEA_ADMIN_PW: ${GITEA_ADMIN_PW}
      DOMAIN: ${DOMAIN}
      FLAG_GITEA_SSHKEY: ${FLAG_GITEA_SSHKEY}
      DEPLOY_USER: ${DEPLOY_USER}
    volumes:
      - gitea_data:/data
      - ./seed/keys:/seed/keys:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/healthz >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 40s
    mem_limit: 192m

  postgres:
    <<: *common
    image: ${POSTGRES_IMAGE}
    hostname: postgres
    networks:
      corp_net:
        ipv4_address: 172.30.3.22
      data_net:
        ipv4_address: 172.30.5.20
    expose:
      - "5432"
    environment:
      <<: *tz
      POSTGRES_USER: ${PG_SUPER_USER}
      POSTGRES_PASSWORD: ${PG_SUPER_PW}
      POSTGRES_DB: ${PG_DB}
      PG_APP_USER: ${PG_APP_USER}
      PG_APP_PW: ${PG_APP_PW}
      FLAG_DB_PII: ${FLAG_DB_PII}
      FLAG_CROWN_JEWEL: ${FLAG_CROWN_JEWEL}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_SUPER_USER} -d ${PG_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 192m