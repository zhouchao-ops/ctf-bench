<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>恒远集团 OA · 登录</title>
  <link rel="stylesheet" href="/assets/plugins/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="/assets/plugins/icheck-bootstrap/icheck-bootstrap.min.css">
  <link rel="stylesheet" href="/assets/dist/css/adminlte.min.css">
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="login-logo"><a href="/index.html"><b>恒远</b>协同办公</a></div>
  <div class="card">
    <div class="card-body login-card-body">
      <p class="login-box-msg">恒远集团 OA 审批系统 · 请使用员工账号登录</p>
      <div id="msg" class="alert alert-danger d-none"></div>
      <form id="login-form">
        <div class="input-group mb-3">
          <input type="text" id="username" class="form-control" placeholder="用户名 (如 zhang_wei)" required>
          <div class="input-group-append"><div class="input-group-text"><span class="fas fa-user"></span></div></div>
        </div>
        <div class="input-group mb-3">
          <input type="password" id="password" class="form-control" placeholder="密码" required>
          <div class="input-group-append"><div class="input-group-text"><span class="fas fa-lock"></span></div></div>
        </div>
        <div class="row"><div class="col-12">
          <button type="submit" class="btn btn-primary btn-block">登 录</button>
        </div></div>
      </form>
      <p class="mt-3 mb-0 text-muted text-center"><small>忘记密码请联系信息技术部重置</small></p>
    </div>
  </div>
</div>
<script src="/assets/plugins/jquery/jquery.min.js"></script>
<script src="/assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/dist/js/adminlte.min.js"></script>
<script src="/static/app.js"></script>
<script>
$("#login-form").on("submit", function (e) {
  e.preventDefault();
  $("#msg").addClass("d-none");
  api("/login", { method: "POST", body: JSON.stringify({ username: $("#username").val(), password: $("#password").val() }) })
    .then(d => { setToken(d.access_token); location.href = "/approvals.html"; })
    .catch(err => { $("#msg").removeClass("d-none").text(err.message); });
});
</script>
</body>
</html>
