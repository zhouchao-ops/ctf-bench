<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>恒远集团 OA · 审批详情</title>
  <link rel="stylesheet" href="/assets/plugins/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="/assets/dist/css/adminlte.min.css">
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a></li>
      <li class="nav-item d-none d-sm-inline-block"><a href="/approvals.html" class="nav-link">审批工作台</a></li>
    </ul>
    <ul class="navbar-nav ml-auto"><li class="nav-item"><a class="nav-link" href="#" onclick="logout();return false;"><i class="fas fa-sign-out-alt"></i> 退出</a></li></ul>
  </nav>
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="/approvals.html" class="brand-link"><img src="/assets/dist/img/AdminLTELogo.png" class="brand-image img-circle elevation-3" style="opacity:.8"><span class="brand-text font-weight-light">恒远 OA</span></a>
    <div class="sidebar">
      <div class="user-panel mt-3 pb-3 mb-3 d-flex"><div class="image"><img src="/assets/dist/img/avatar.png" class="img-circle elevation-2"></div><div class="info"><a href="#" class="d-block" id="user-name">访客</a><small class="text-muted" id="user-role"></small></div></div>
      <nav class="mt-2"><ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
        <li class="nav-item"><a href="/approvals.html" data-page="approvals" class="nav-link"><i class="nav-icon fas fa-file-invoice"></i><p>审批工作台</p></a></li>
      </ul></nav>
    </div>
  </aside>
  <div class="content-wrapper">
    <div class="content-header"><div class="container-fluid"><div class="row mb-2"><div class="col-sm-6"><h1 class="m-0">审批单详情 <span id="title-id" class="text-muted"></span></h1></div><div class="col-sm-6"><ol class="breadcrumb float-sm-right"><li class="breadcrumb-item"><a href="/approvals.html">审批工作台</a></li><li class="breadcrumb-item active">详情</li></ol></div></div></div></div>
    <div class="content"><div class="container-fluid">
      <div id="msg" class="alert alert-danger d-none"></div>
      <div id="pay-result" class="alert alert-success d-none"></div>
      <div class="row">
        <div class="col-md-7">
          <div class="card">
            <div class="card-header"><h3 class="card-title">单据信息</h3></div>
            <div class="card-body p-0">
              <table class="table table-bordered mb-0">
                <tbody>
                  <tr><th style="width:160px">单号</th><td id="f-id"></td></tr>
                  <tr><th>所属部门</th><td id="f-dept"></td></tr>
                  <tr><th>申请人工号</th><td id="f-owner"></td></tr>
                  <tr><th>供应商 / 事由</th><td id="f-vendor"></td></tr>
                  <tr><th>金额</th><td id="f-amount"></td></tr>
                  <tr><th>状态</th><td id="f-status"></td></tr>
                  <tr><th>当前步骤</th><td id="f-step"></td></tr>
                  <tr><th>已付款</th><td id="f-paid"></td></tr>
                  <tr><th>付款凭证</th><td id="f-token" class="text-monospace"></td></tr>
                </tbody>
              </table>
            </div>
            <div class="card-footer">
              <button class="btn btn-success btn-sm" id="btn-approve"><i class="fas fa-check"></i> 审批通过</button>
              <button class="btn btn-warning btn-sm" id="btn-withdraw"><i class="fas fa-undo"></i> 撤回</button>
              <button class="btn btn-info btn-sm" id="btn-resubmit"><i class="fas fa-redo"></i> 重新提交</button>
              <button class="btn btn-primary btn-sm" id="btn-pay"><i class="fas fa-money-bill-wave"></i> 付款</button>
            </div>
          </div>
        </div>
        <div class="col-md-5">
          <div class="card">
            <div class="card-header"><h3 class="card-title">审批记录</h3></div>
            <div class="card-body"><ul class="list-group list-group-unbordered" id="timeline"></ul></div>
          </div>
          <div class="card">
            <div class="card-header"><h3 class="card-title">编辑单据</h3></div>
            <div class="card-body">
              <form id="edit-form">
                <div class="form-group"><label>金额</label><input type="number" step="0.01" id="e-amount" class="form-control"></div>
                <div class="form-group"><label>供应商 / 事由</label><input type="text" id="e-vendor" class="form-control"></div>
                <button class="btn btn-default btn-sm" type="submit"><i class="fas fa-save"></i> 保存修改</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div></div>
  </div>
  <footer class="main-footer"><strong>Copyright &copy; 2023 恒远集团信息技术部.</strong></footer>
</div>
<script src="/assets/plugins/jquery/jquery.min.js"></script>
<script src="/assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/dist/js/adminlte.min.js"></script>
<script src="/static/app.js"></script>
<script>
requireAuth(); renderShell("approvals");
const id = new URLSearchParams(location.search).get("id");
$("#title-id").text("#" + id);
function showErr(e) { $("#msg").removeClass("d-none").text(e.message); }
function load() {
  $("#msg").addClass("d-none");
  api("/approvals/" + id).then(a => {
    $("#f-id").text(a.id); $("#f-dept").text(a.dept); $("#f-owner").text(a.owner_uid);
    $("#f-vendor").text(a.vendor); $("#f-amount").text("¥" + Number(a.amount).toFixed(2));
    $("#f-status").html(statusBadge(a.status)); $("#f-step").text(a.current_step + " / 3");
    $("#f-paid").html(a.is_paid ? '<span class="badge badge-success">是</span>' : '<span class="badge badge-secondary">否</span>');
    $("#f-token").text(a.vendor_token || "—");
    $("#e-amount").val(a.amount); $("#e-vendor").val(a.vendor);
    const tl = $("#timeline").empty();
    if (!(a.approvals || []).length) tl.append('<li class="list-group-item text-muted">暂无审批记录</li>');
    (a.approvals || []).forEach((s, i) => {
      tl.append('<li class="list-group-item"><b>' + (i + 1) + '. ' + esc(STEP_LABEL[s.step] || s.step) +
        '</b><span class="float-right text-muted">' + esc(s.by) + '</span></li>');
    });
  }).catch(showErr);
}
function act(suffix, opts) {
  $("#msg,#pay-result").addClass("d-none");
  api("/approvals/" + id + "/" + suffix, Object.assign({ method: "POST" }, opts || {}))
    .then(d => { if (d && d.flag) { $("#pay-result").removeClass("d-none").html("付款成功！凭证: <b>" + esc(d.vendor_token) + "</b><br>金额: ¥" + Number(d.amount).toFixed(2)); } load(); })
    .catch(showErr);
}
$("#btn-approve").on("click", () => act("approve"));
$("#btn-withdraw").on("click", () => act("withdraw"));
$("#btn-resubmit").on("click", () => act("resubmit"));
$("#btn-pay").on("click", () => act("pay"));
$("#edit-form").on("submit", function (e) {
  e.preventDefault();
  $("#msg").addClass("d-none");
  api("/approvals/" + id, { method: "PUT", body: JSON.stringify({ amount: parseFloat($("#e-amount").val()), vendor: $("#e-vendor").val() }) })
    .then(() => load()).catch(showErr);
});
load();
</script>
</body>
</html>
