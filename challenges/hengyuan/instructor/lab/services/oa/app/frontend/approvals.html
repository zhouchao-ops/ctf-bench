<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>恒远集团 OA · 审批工作台</title>
  <link rel="stylesheet" href="/assets/plugins/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="/assets/dist/css/adminlte.min.css">
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a></li>
      <li class="nav-item d-none d-sm-inline-block"><a href="/approvals.html" class="nav-link">审批工作台</a></li>
    </ul>
    <ul class="navbar-nav ml-auto"><li class="nav-item"><a class="nav-link" href="#" onclick="logout();return false;"><i class="fas fa-sign-out-alt"></i> 退出</a></li></ul>
  </nav>
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="/approvals.html" class="brand-link"><img src="/assets/dist/img/AdminLTELogo.png" class="brand-image img-circle elevation-3" style="opacity:.8"><span class="brand-text font-weight-light">恒远 OA</span></a>
    <div class="sidebar">
      <div class="user-panel mt-3 pb-3 mb-3 d-flex"><div class="image"><img src="/assets/dist/img/avatar.png" class="img-circle elevation-2"></div><div class="info"><a href="#" class="d-block" id="user-name">访客</a><small class="text-muted" id="user-role"></small></div></div>
      <nav class="mt-2"><ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
        <li class="nav-item"><a href="/approvals.html" data-page="approvals" class="nav-link"><i class="nav-icon fas fa-file-invoice"></i><p>审批工作台</p></a></li>
      </ul></nav>
    </div>
  </aside>
  <div class="content-wrapper">
    <div class="content-header"><div class="container-fluid"><div class="row mb-2"><div class="col-sm-6"><h1 class="m-0">审批工作台</h1></div><div class="col-sm-6"><ol class="breadcrumb float-sm-right"><li class="breadcrumb-item active">本部门审批单</li></ol></div></div></div></div>
    <div class="content"><div class="container-fluid">
      <div class="card">
        <div class="card-header"><h3 class="card-title">新建审批单</h3></div>
        <div class="card-body">
          <form id="create-form" class="form-inline">
            <label class="mr-2">金额</label>
            <input type="number" step="0.01" id="amount" class="form-control mr-2" placeholder="0.00" required>
            <label class="mr-2">供应商 / 事由</label>
            <input type="text" id="vendor" class="form-control mr-2" style="min-width:240px" placeholder="如 办公用品采购" required>
            <button class="btn btn-primary" type="submit"><i class="fas fa-plus"></i> 提交</button>
          </form>
          <div id="create-msg" class="alert d-none mt-3 mb-0"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><h3 class="card-title">审批单列表</h3></div>
        <div class="card-body table-responsive p-0">
          <table class="table table-hover table-striped">
            <thead><tr><th>ID</th><th>供应商 / 事由</th><th>金额</th><th>状态</th><th>当前步骤</th><th>已付款</th><th>操作</th></tr></thead>
            <tbody id="rows"><tr><td colspan="7" class="text-muted text-center">加载中…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div></div>
  </div>
  <footer class="main-footer"><strong>Copyright &copy; 2023 恒远集团信息技术部.</strong></footer>
</div>
<script src="/assets/plugins/jquery/jquery.min.js"></script>
<script src="/assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/dist/js/adminlte.min.js"></script>
<script src="/static/app.js"></script>
<script>
requireAuth(); renderShell("approvals");
function load() {
  api("/approvals").then(list => {
    const tb = $("#rows").empty();
    if (!list.length) { tb.append('<tr><td colspan="7" class="text-muted text-center">暂无审批单</td></tr>'); return; }
    list.forEach(a => {
      tb.append("<tr><td>" + a.id + "</td><td>" + esc(a.vendor) + "</td><td>¥" + Number(a.amount).toFixed(2) +
        "</td><td>" + statusBadge(a.status) + "</td><td>" + a.current_step + " / 3</td><td>" +
        (a.is_paid ? '<span class="badge badge-success">是</span>' : '<span class="badge badge-secondary">否</span>') +
        '</td><td><a class="btn btn-sm btn-info" href="/detail.html?id=' + a.id + '"><i class="fas fa-eye"></i> 查看</a></td></tr>');
    });
  }).catch(e => { $("#rows").html('<tr><td colspan="7" class="text-danger text-center">' + esc(e.message) + '</td></tr>'); });
}
$("#create-form").on("submit", function (e) {
  e.preventDefault();
  $("#create-msg").addClass("d-none");
  api("/approvals", { method: "POST", body: JSON.stringify({ amount: parseFloat($("#amount").val()), vendor: $("#vendor").val() }) })
    .then(a => { $("#create-msg").removeClass("d-none alert-danger").addClass("alert-success").text("已创建审批单 #" + a.id); $("#amount,#vendor").val(""); load(); })
    .catch(err => { $("#create-msg").removeClass("d-none alert-success").addClass("alert-danger").text(err.message); });
});
load();
</script>
</body>
</html>
