APP_NAME = 恒远集团代码托管
RUN_USER = git
RUN_MODE = prod

[server]
DOMAIN           = gitea.devops.hengyuan.local
ROOT_URL         = http://gitea.devops.hengyuan.local:3000/
HTTP_PORT        = 3000
SSH_PORT         = 22
DISABLE_SSH      = false
START_SSH_SERVER = true
OFFLINE_MODE     = true

[database]
DB_TYPE = sqlite3
PATH    = /data/gitea/gitea.db

[security]
INSTALL_LOCK = true
SECRET_KEY   = hengyuan-gitea-secret-2023

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW  = true

[repository]
ROOT = /data/git/repositories

[log]
MODE  = console
LEVEL = Info