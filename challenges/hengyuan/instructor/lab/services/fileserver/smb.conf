[global]
   workgroup = HENGYUAN
   realm = HENGYUAN.LOCAL
   security = ADS
   kerberos method = secrets and keytab
   winbind use default domain = yes
   winbind offline logon = no
   idmap config * : backend = tdb
   idmap config * : range = 3000-7999
   idmap config HENGYUAN : backend = ad
   idmap config HENGYUAN : schema_mode = rfc2307
   idmap config HENGYUAN : range = 10000-99999
   vfs objects = acl_xattr
   map acl inherit = yes
   store dos attributes = yes
   log file = /var/log/samba/log.%m
   max log size = 1000

[finance-docs]
   path = /srv/shares/finance-docs
   read only = no
   valid users = @"HENGYUAN\Domain Users"
   browseable = yes

[public]
   path = /srv/shares/public
   read only = yes
   valid users = @"HENGYUAN\Domain Users"
   browseable = yes

# 隐藏共享, 仅 Domain Admins (Path C: DA -> crown jewels 凭证 + DC 备份)
[IT-Backup$]
   path = /srv/shares/IT-backup
   read only = no
   valid users = @"HENGYUAN\Domain Admins"
   browseable = no

[DA-Only$]
   path = /srv/shares/DA-Only
   read only = no
   valid users = @"HENGYUAN\Domain Admins"
   browseable = no