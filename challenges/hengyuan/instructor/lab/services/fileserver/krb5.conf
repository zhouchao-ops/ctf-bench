[libdefaults]
    default_realm = HENGYUAN.LOCAL
    dns_lookup_realm = false
    dns_lookup_kdc = true

[realms]
    HENGYUAN.LOCAL = {
        kdc = dc01.hengyuan.local
        admin_server = dc01.hengyuan.local
    }

[domain_realm]
    .hengyuan.local = HENGYUAN.LOCAL
    hengyuan.local = HENGYUAN.LOCAL