server {
    listen 443 ssl;
    server_name www.hengyuan.local hengyuan.local;

    ssl_certificate     /etc/nginx/certs/server.pem;
    ssl_certificate_key /etc/nginx/certs/server-key.pem;

    root /var/www;

    location = /healthz   { return 200 "ok\n"; }
    location = /robots.txt { }
    location = /flag.txt   { }   # D5 诱饵: web 根假 flag

    # D1 诱饵: /admin (admin:admin123) -> soc-honeypot 假面板
    location /admin {
        proxy_pass http://honeypot_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 门户应用静态资源 (app.js / 公开公钥) 由 portal 自身服务
    location = /static/app.js {
        proxy_pass http://portal_upstream;
        proxy_set_header Host $host;
    }
    location = /static/public.pem {
        proxy_pass http://portal_upstream;
        proxy_set_header Host $host;
    }

    # 配置缺陷: alias 尾斜杠不匹配 -> /static../upstream.conf.bak 穿越读取内网配置
    location /static {
        alias /var/www/static/;
    }

    location / {
        proxy_pass http://portal_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}