worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # 内网上游 (静态 IP, 与 compose 一致)
    upstream portal_upstream   { server 172.30.1.20:8000; }
    upstream supplier_upstream { server 172.30.2.20:8080; }   # DMZ
    upstream honeypot_upstream { server 172.30.1.30:8000; }   # D1 诱饵

    # HTTP -> HTTPS (healthz 例外, 供容器健康检查)
    server {
        listen 80 default_server;
        server_name _;
        location = /healthz { return 200 "ok\n"; }
        location / { return 301 https://$host$request_uri; }
    }

    include /etc/nginx/conf.d/*.conf;
}