<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>恒远集团门户 · 忘记密码</title>
  <link rel="stylesheet" href="/assets/plugins/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="/assets/dist/css/adminlte.min.css">
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="login-logo"><a href="/index.html"><b>恒远</b>集团门户</a></div>
  <div class="card">
    <div class="card-body login-card-body">
      <p class="login-box-msg">输入您的工号，系统将向您的企业邮箱发送密码重置链接。</p>
      <div id="msg" class="alert d-none"></div>
      <form id="forgot-form">
        <div class="input-group mb-3">
          <input type="number" id="uid" class="form-control" placeholder="工号 (如 1001)" required>
          <div class="input-group-append"><div class="input-group-text"><span class="fas fa-id-badge"></span></div></div>
        </div>
        <div class="row"><div class="col-12">
          <button type="submit" class="btn btn-primary btn-block">发送重置链接</button>
        </div></div>
      </form>
      <p class="mt-3 mb-1"><a href="/index.html">返回登录</a></p>
      <p class="mb-0"><a href="/reset.html">已有重置令牌？点此重置</a></p>
    </div>
  </div>
</div>
<script src="/assets/plugins/jquery/jquery.min.js"></script>
<script src="/assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/dist/js/adminlte.min.js"></script>
<script src="/static/app.js"></script>
<script>
$("#forgot-form").on("submit", function (e) {
  e.preventDefault();
  const uid = $("#uid").val();
  $("#msg").addClass("d-none");
  api("/password-reset", { method: "POST", body: JSON.stringify({ uid: parseInt(uid, 10) }) })
    .then(d => { $("#msg").removeClass("d-none alert-danger").addClass("alert-success").text(d.msg || "重置链接已发送，请查收企业邮箱。"); })
    .catch(err => { $("#msg").removeClass("d-none alert-success").addClass("alert-danger").text(err.message); });
});
</script>
</body>
</html>
