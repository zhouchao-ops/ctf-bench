<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>恒远集团门户 · 重置密码</title>
  <link rel="stylesheet" href="/assets/plugins/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="/assets/dist/css/adminlte.min.css">
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="login-logo"><a href="/index.html"><b>恒远</b>集团门户</a></div>
  <div class="card">
    <div class="card-body login-card-body">
      <p class="login-box-msg">请输入邮件中的重置令牌并设置新密码。</p>
      <div id="msg" class="alert d-none"></div>
      <form id="reset-form">
        <div class="input-group mb-3">
          <input type="number" id="uid" class="form-control" placeholder="工号" required>
          <div class="input-group-append"><div class="input-group-text"><span class="fas fa-id-badge"></span></div></div>
        </div>
        <div class="input-group mb-3">
          <input type="text" id="token" class="form-control" placeholder="重置令牌" required>
          <div class="input-group-append"><div class="input-group-text"><span class="fas fa-key"></span></div></div>
        </div>
        <div class="input-group mb-3">
          <input type="password" id="new_password" class="form-control" placeholder="新密码" required>
          <div class="input-group-append"><div class="input-group-text"><span class="fas fa-lock"></span></div></div>
        </div>
        <div class="row"><div class="col-12">
          <button type="submit" class="btn btn-primary btn-block">重置密码</button>
        </div></div>
      </form>
      <p class="mt-3 mb-1"><a href="/index.html">返回登录</a></p>
    </div>
  </div>
</div>
<script src="/assets/plugins/jquery/jquery.min.js"></script>
<script src="/assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/dist/js/adminlte.min.js"></script>
<script src="/static/app.js"></script>
<script>
const qs = new URLSearchParams(location.search);
if (qs.get("uid")) $("#uid").val(qs.get("uid"));
if (qs.get("token")) $("#token").val(qs.get("token"));
$("#reset-form").on("submit", function (e) {
  e.preventDefault();
  const params = new URLSearchParams({
    uid: $("#uid").val(), token: $("#token").val(), new_password: $("#new_password").val()
  });
  $("#msg").addClass("d-none");
  api("/reset?" + params.toString())
    .then(d => { $("#msg").removeClass("d-none alert-danger").addClass("alert-success").text((d.msg || "密码已重置。") + " 请返回登录。"); })
    .catch(err => { $("#msg").removeClass("d-none alert-success").addClass("alert-danger").text(err.message); });
});
</script>
</body>
</html>
