<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>恒远集团门户 · 登录</title>
  <link rel="stylesheet" href="/assets/plugins/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="/assets/plugins/icheck-bootstrap/icheck-bootstrap.min.css">
  <link rel="stylesheet" href="/assets/dist/css/adminlte.min.css">
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="login-logo">
    <a href="/index.html"><b>恒远</b>集团门户</a>
  </div>
  <div class="card">
    <div class="card-body login-card-body">
      <p class="login-box-msg">登录以开始您的会话</p>
      <div id="msg" class="alert alert-danger d-none"></div>
      <form id="login-form">
        <div class="input-group mb-3">
          <input type="text" id="username" class="form-control" placeholder="用户名 (如 zhang_wei)" autocomplete="username">
          <div class="input-group-append"><div class="input-group-text"><span class="fas fa-user"></span></div></div>
        </div>
        <div class="input-group mb-3">
          <input type="password" id="password" class="form-control" placeholder="密码" autocomplete="current-password">
          <div class="input-group-append"><div class="input-group-text"><span class="fas fa-lock"></span></div></div>
        </div>
        <div class="row">
          <div class="col-8">
            <div class="icheck-primary">
              <input type="checkbox" id="remember"><label for="remember">记住我</label>
            </div>
          </div>
          <div class="col-4">
            <button type="submit" class="btn btn-primary btn-block">登录</button>
          </div>
        </div>
      </form>
      <p class="mb-1 mt-3"><a href="/forgot.html">忘记密码？</a></p>
      <p class="mb-0 text-muted text-sm">仅限恒远集团授权员工访问 · 信息技术部运维</p>
    </div>
  </div>
</div>
<script src="/assets/plugins/jquery/jquery.min.js"></script>
<script src="/assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/dist/js/adminlte.min.js"></script>
<script src="/static/app.js"></script>
<script>
$("#login-form").on("submit", async function (e) {
  e.preventDefault();
  $("#msg").addClass("d-none");
  try {
    const r = await api("/login", { method: "POST", body: JSON.stringify({
      username: $("#username").val().trim(), password: $("#password").val() }) });
    setToken(r.access_token);
    location.href = "/dashboard.html";
  } catch (err) {
    $("#msg").removeClass("d-none").text(err.message);
  }
});
</script>
</body>
</html>
