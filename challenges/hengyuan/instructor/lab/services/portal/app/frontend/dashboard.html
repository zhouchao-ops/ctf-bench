<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>恒远集团门户 · 工作台</title>
  <link rel="stylesheet" href="/assets/plugins/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="/assets/dist/css/adminlte.min.css">
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a></li>
      <li class="nav-item d-none d-sm-inline-block"><a href="/dashboard.html" class="nav-link">工作台</a></li>
    </ul>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item"><a class="nav-link" href="#" onclick="logout();return false;"><i class="fas fa-sign-out-alt"></i> 退出</a></li>
    </ul>
  </nav>

  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="/dashboard.html" class="brand-link">
      <img src="/assets/dist/img/AdminLTELogo.png" alt="logo" class="brand-image img-circle elevation-3" style="opacity:.8">
      <span class="brand-text font-weight-light">恒远集团</span>
    </a>
    <div class="sidebar">
      <div class="user-panel mt-3 pb-3 mb-3 d-flex">
        <div class="image"><img src="/assets/dist/img/avatar.png" class="img-circle elevation-2" alt="user"></div>
        <div class="info"><a href="#" class="d-block" id="user-name">访客</a><small class="text-muted" id="user-role"></small></div>
      </div>
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
          <li class="nav-item"><a href="/dashboard.html" data-page="dashboard" class="nav-link"><i class="nav-icon fas fa-tachometer-alt"></i><p>工作台</p></a></li>
          <li class="nav-item"><a href="/profile.html" data-page="profile" class="nav-link"><i class="nav-icon fas fa-user"></i><p>个人资料</p></a></li>
          <li class="nav-item"><a href="/search.html" data-page="search" class="nav-link"><i class="nav-icon fas fa-search"></i><p>站内搜索</p></a></li>
          <li class="nav-item"><a href="/admin.html" data-page="admin" class="nav-link"><i class="nav-icon fas fa-users-cog"></i><p>系统管理</p></a></li>
        </ul>
      </nav>
    </div>
  </aside>

  <div class="content-wrapper">
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6"><h1 class="m-0">工作台</h1></div>
          <div class="col-sm-6"><ol class="breadcrumb float-sm-right"><li class="breadcrumb-item"><a href="/dashboard.html">首页</a></li><li class="breadcrumb-item active">工作台</li></ol></div>
        </div>
      </div>
    </div>
    <div class="content">
      <div class="container-fluid">
        <div class="row">
          <div class="col-lg-3 col-6"><div class="small-box bg-info"><div class="inner"><h3 id="stat-uid">—</h3><p>我的工号</p></div><div class="icon"><i class="fas fa-id-badge"></i></div></div></div>
          <div class="col-lg-3 col-6"><div class="small-box bg-success"><div class="inner"><h3 id="stat-dept">—</h3><p>所属部门</p></div><div class="icon"><i class="fas fa-building"></i></div></div></div>
          <div class="col-lg-3 col-6"><div class="small-box bg-warning"><div class="inner"><h3>5</h3><p>集团部门</p></div><div class="icon"><i class="fas fa-sitemap"></i></div></div></div>
          <div class="col-lg-3 col-6"><div class="small-box bg-danger"><div class="inner"><h3>在线</h3><p>系统状态</p></div><div class="icon"><i class="fas fa-server"></i></div></div></div>
        </div>
        <div class="card">
          <div class="card-header"><h3 class="card-title">欢迎，<span id="welcome-name">同事</span></h3></div>
          <div class="card-body">
            <p>恒远集团统一门户集成人事资料、站内检索与系统管理。制造与零售业务板块的日常审批请前往 <b>OA 办公系统</b> 办理。</p>
            <p class="text-muted">如需重置密码，请使用登录页「忘记密码」流程；重置链接将发送至注册邮箱。</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="main-footer">
    <div class="float-right d-none d-sm-inline">内部系统 · 请勿外传</div>
    <strong>Copyright &copy; 2023 恒远集团信息技术部.</strong>
  </footer>
</div>
<script src="/assets/plugins/jquery/jquery.min.js"></script>
<script src="/assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/dist/js/adminlte.min.js"></script>
<script src="/static/app.js"></script>
<script>
requireAuth();
renderShell("dashboard");
const u = currentUser() || {};
$("#welcome-name").text(u.username || "同事");
$("#stat-uid").text(u.sub || "—");
api("/users/" + u.sub + "/profile").then(p => {
  $("#stat-dept").text(p.dept || "—");
  $("#welcome-name").text(p.name || u.username);
}).catch(() => {});
</script>
</body>
</html>
