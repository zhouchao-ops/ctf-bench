<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>恒远集团门户 · 系统管理</title>
  <link rel="stylesheet" href="/assets/plugins/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="/assets/dist/css/adminlte.min.css">
</head>
<body class="hold-transition sidebar-mini">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a></li>
      <li class="nav-item d-none d-sm-inline-block"><a href="/dashboard.html" class="nav-link">工作台</a></li>
    </ul>
    <ul class="navbar-nav ml-auto"><li class="nav-item"><a class="nav-link" href="#" onclick="logout();return false;"><i class="fas fa-sign-out-alt"></i> 退出</a></li></ul>
  </nav>
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="/dashboard.html" class="brand-link"><img src="/assets/dist/img/AdminLTELogo.png" class="brand-image img-circle elevation-3" style="opacity:.8"><span class="brand-text font-weight-light">恒远集团</span></a>
    <div class="sidebar">
      <div class="user-panel mt-3 pb-3 mb-3 d-flex"><div class="image"><img src="/assets/dist/img/avatar.png" class="img-circle elevation-2"></div><div class="info"><a href="#" class="d-block" id="user-name">访客</a><small class="text-muted" id="user-role"></small></div></div>
      <nav class="mt-2"><ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
        <li class="nav-item"><a href="/dashboard.html" data-page="dashboard" class="nav-link"><i class="nav-icon fas fa-tachometer-alt"></i><p>工作台</p></a></li>
        <li class="nav-item"><a href="/profile.html" data-page="profile" class="nav-link"><i class="nav-icon fas fa-user"></i><p>个人资料</p></a></li>
        <li class="nav-item"><a href="/search.html" data-page="search" class="nav-link"><i class="nav-icon fas fa-search"></i><p>站内搜索</p></a></li>
        <li class="nav-item"><a href="/admin.html" data-page="admin" class="nav-link"><i class="nav-icon fas fa-users-cog"></i><p>系统管理</p></a></li>
      </ul></nav>
    </div>
  </aside>
  <div class="content-wrapper">
    <div class="content-header"><div class="container-fluid"><div class="row mb-2"><div class="col-sm-6"><h1 class="m-0">用户管理</h1></div><div class="col-sm-6"><ol class="breadcrumb float-sm-right"><li class="breadcrumb-item"><a href="/dashboard.html">首页</a></li><li class="breadcrumb-item active">系统管理</li></ol></div></div></div></div>
    <div class="content"><div class="container-fluid">
      <div class="card">
        <div class="card-header"><h3 class="card-title">全部用户 (仅管理员)</h3></div>
        <div class="card-body">
          <div id="msg" class="alert alert-danger d-none"></div>
          <table class="table table-bordered table-striped" id="users-table" style="display:none">
            <thead><tr><th>工号</th><th>用户名</th><th>姓名</th><th>部门</th><th>职务</th><th>邮箱</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div></div>
  </div>
  <footer class="main-footer"><strong>Copyright &copy; 2023 恒远集团信息技术部.</strong></footer>
</div>
<script src="/assets/plugins/jquery/jquery.min.js"></script>
<script src="/assets/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/assets/dist/js/adminlte.min.js"></script>
<script src="/static/app.js"></script>
<script>
requireAuth(); renderShell("admin");
api("/admin/users").then(list => {
  $("#users-table").show();
  const tb = $("#users-table tbody");
  list.forEach(u => {
    tb.append("<tr><td>" + esc(u.uid) + "</td><td>" + esc(u.username) + "</td><td>" + esc(u.name) +
      "</td><td>" + esc(u.dept) + "</td><td>" + esc(u.role) + "</td><td>" + esc(u.email) + "</td></tr>");
  });
}).catch(err => { $("#msg").removeClass("d-none").text(err.message); });
</script>
</body>
</html>
